// Minecraft 26.1 and later are unobfuscated: they need a different loom plugin and no mappings at all.
// Derived from the version string so that it is known before any plugin is applied; the numbers match
// the mcVersion of the preprocess nodes declared in the root build.gradle.
def toMcVersion = { String version ->
	def parts = version.tokenize('.').collect { it as int }
	parts[0] * 10000 + (parts.size() > 1 ? parts[1] : 0) * 100 + (parts.size() > 2 ? parts[2] : 0)
}
final int mcVersion = toMcVersion(project.minecraft_version as String)
final boolean unobfuscated = mcVersion >= 260000

apply plugin: 'maven-publish'
apply plugin: 'com.github.hierynomus.license'
// loom has to be applied before preprocess: preprocess' afterEvaluate hook reads loom's mappings provider,
// so it must be registered after the one of loom
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'

repositories {
	maven {
		url = 'https://jitpack.io'
	}
	maven {
		url = 'https://maven.fallenbreath.me/releases'
	}
	maven {
        url 'https://masa.dy.fi/maven'
    }
}

// https://github.com/FabricMC/fabric-loader/issues/783
configurations {
	if (!unobfuscated) {
		// modRuntimeOnly is not part of runtimeClasspath, so excluding here is safe.
		// On 26.1+ the remapping configurations are gone and an exclude rule on runtimeOnly
		// would be inherited by runtimeClasspath and drop the loader itself, so the transitive
		// loader dependencies are excluded per dependency in the dependencies block below instead.
		modRuntimeOnly.exclude group: 'net.fabricmc', module: 'fabric-loader'
	}
}

dependencies {
	// 26.1+ dropped the remapping configurations (modImplementation / modApi / modRuntimeOnly ...)
	// while mods on 26.1+ no longer carry a loader dependency that has to be excluded globally,
	// so every dependency excludes the transitively pulled fabric-loader explicitly
	def processDependency = { dep ->
		// https://github.com/FabricMC/fabric-loader/issues/783
		if (dep instanceof ModuleDependency && !(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
			dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
		}
		return dep
	}
	def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
	def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modRuntimeOnly(*args)) }
	def mixinextrasVersion = unobfuscated ? project.mixinextras_version_unobf : project.mixinextras_version
	def mixinAuditorVersion = unobfuscated ? project.mixin_auditor_version_unobf : project.mixin_auditor_version

	// loom
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (!unobfuscated) {
		mappings loom.officialMojangMappings()
	}
	autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	autoImplementation "carpet:fabric-carpet:${project.carpet_version}"

	// dependencies
	include(autoImplementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))
	include(annotationProcessor(implementation("io.github.llamalad7:mixinextras-fabric:${mixinextrasVersion}")))

    // runtime
    autoRuntimeOnly "me.fallenbreath:mixin-auditor:${mixinAuditorVersion}"
}

String MIXIN_CONFIG_PATH = 'yetanothercarpetaddition.mixins.json'
String LANG_DIR = 'assets/yetanothercarpetaddition/lang'
JavaVersion JAVA_COMPATIBILITY
if (mcVersion >= 260000) {
	JAVA_COMPATIBILITY = JavaVersion.toVersion('25')
} else if (mcVersion >= 12005) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_21
} else if (mcVersion >= 11800) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_17
} else if (mcVersion >= 11700) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_16
} else {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_1_8
}
// e.g. JAVA_21 / JAVA_25, used as the mixin compatibility level
String MIXIN_COMPATIBILITY_LEVEL = "JAVA_${JAVA_COMPATIBILITY.majorVersion}"

loom {
	accessWidenerPath = file("YACA.accesswidener")

	def commonVmArgs = ['-Dmixin.debug.export=true']
	runConfigs.configureEach {
		// to make sure it generates all "Minecraft Client (:subproject_name)" applications
		ideConfigGenerated = true
		runDir '../../run'
		vmArgs commonVmArgs
	}

    runs {
        def auditVmArgs = ['-DmixinAuditor.audit=true', '-Dmixin.debug.export=true']
        serverMixinAudit {
            server()
            vmArgs auditVmArgs
            ideConfigGenerated false
        }

        clientMixinAudit {
            client()
            vmArgs(*auditVmArgs, '-DmixinAuditor.when=game_init')
            ideConfigGenerated false
        }
    }
}

String modVersionSuffix = ''
String artifactVersion = project.mod_version
String artifactVersionSuffix = ''
// detect github action environment variables
// https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
if (System.getenv("BUILD_RELEASE") != "true") {
	String buildNumber = System.getenv("BUILD_ID")
	modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
	artifactVersionSuffix = '-SNAPSHOT'  // A non-release artifact is always a SNAPSHOT artifact
}
String fullModVersion = project.mod_version + modVersionSuffix
String fullProjectVersion, fullArtifactVersion

// Example version values:
//   project.mod_version     1.0.3                      (the base mod version)
//   modVersionSuffix        +build.88                  (use github action build number if possible)
//   artifactVersionSuffix   -SNAPSHOT
//   fullModVersion          1.0.3+build.88             (the actual mod version to use in the mod)
//   fullProjectVersion      v1.0.3-mc1.15.2+build.88   (in build output jar name)
//   fullArtifactVersion     1.0.3-mc1.15.2-SNAPSHOT    (maven artifact version)

group = project.maven_group
if (System.getenv("JITPACK") == "true") {
	// move mc version into archivesBaseName, so jitpack will be able to organize archives from multiple subprojects correctly
	base.archivesName = project.archives_base_name + '-mc' + project.minecraft_version
	fullProjectVersion = 'v' + project.mod_version + modVersionSuffix
	fullArtifactVersion = artifactVersion + artifactVersionSuffix
} else {
	base.archivesName = project.archives_base_name
	fullProjectVersion = 'v' + project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
	fullArtifactVersion = artifactVersion + '-mc' + project.minecraft_version + artifactVersionSuffix
}
version = fullProjectVersion

// See https://youtrack.jetbrains.com/issue/IDEA-296490
// if IDEA complains about "Cannot resolve resource filtering of MatchingCopyAction" and you want to know why
processResources {
	from "YACA.accesswidener"

	inputs.property "id", project.mod_id
	inputs.property "name", project.mod_name
	inputs.property "version", fullModVersion
	inputs.property "minecraft_dependency", project.minecraft_dependency

	filesMatching("fabric.mod.json") {
		def valueMap = [
				"id": project.mod_id,
				"name": project.mod_name,
				"version": fullModVersion,
				"minecraft_dependency": project.minecraft_dependency,
				"carpet_dependency": project.carpet_dependency,
		]
		expand valueMap
	}

	filesMatching(MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', MIXIN_COMPATIBILITY_LEVEL) }
	}
}

// https://github.com/Fallen-Breath/yamlang
yamlang {
	targetSourceSets = [sourceSets.main]
	inputDir = LANG_DIR
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
	// javac stops at 100 errors by default, get the full list instead
	options.compilerArgs << "-Xmaxerrs" << "2000" << "-Xmaxwarns" << "200"
	if (JAVA_COMPATIBILITY <= JavaVersion.VERSION_1_8) {
		// suppressed "source/target value 8 is obsolete and will be removed in a future release"
		options.compilerArgs << '-Xlint:-options'
	}
}

java {
	sourceCompatibility = JAVA_COMPATIBILITY
	targetCompatibility = JAVA_COMPATIBILITY

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// https://github.com/hierynomus/license-gradle-plugin
license {
	// use "gradle licenseFormat" to apply license headers
	header = rootProject.file('HEADER.txt')
	include '**/*.java'
	skipExistingHeaders = true

	headerDefinitions {
		// ref: https://github.com/mathieucarbou/license-maven-plugin/blob/4c42374bb737378f5022a3a36849d5e23ac326ea/license-maven-plugin/src/main/java/com/mycila/maven/plugin/license/header/HeaderType.java#L48
		// modification: add a newline at the end
		SLASHSTAR_STYLE_NEWLINE {
			firstLine = "/*"
			beforeEachLine = " * "
			endLine = " */" + System.lineSeparator()
			afterEachLine = ""
			skipLinePattern = null
			firstLineDetectionPattern = "(\\s|\\t)*/\\*.*\$"
			lastLineDetectionPattern = ".*\\*/(\\s|\\t)*\$"
			allowBlankLines = false
			isMultiline = true
			padLines = false
		}
	}
	mapping {
		java = 'SLASHSTAR_STYLE_NEWLINE'
	}
	ext {
		name = project.mod_name
		author = 'Ryan100c'
		year = Calendar.getInstance().get(Calendar.YEAR).toString()
	}
}
classes.dependsOn licenseFormatMain
testClasses.dependsOn licenseFormatTest

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = base.archivesName.get()
			version = fullArtifactVersion
		}
	}

	// select the repositories you want to publish to
	repositories {
	}
}
