conditionalmixin_version=0.6.4
# https://github.com/LlamaLad7/MixinExtras
mixinextras_version=0.4.1
# MixinExtras for the unobfuscated (>= 26.1) versions, which ship a newer mixin
mixinextras_version_unobf=0.5.5
# https://github.com/Fallen-Breath/mixin-auditor (run-time only, used by the mixinAudit run configs)
mixin_auditor_version=0.1.0
mixin_auditor_version_unobf=0.2.0-u
